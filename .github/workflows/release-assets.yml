name: Release assets

# Builds the sdist, the wheel and the built dashboard (a zip of web/dist, which the wheel does not
# include) for a release and attaches them, with SHA256SUMS. Runs when a
# release is published; run it by hand with a tag to rebuild the assets of an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach assets to (for example v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  build:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build --out-dir dist
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the dashboard
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          cd web && npm ci && npm run build
          cd dist && zip -qr "../../dist/llm-observability-dashboard-${TAG#v}.zip" .
      - name: Check the wheel installs and carries the release version
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          uv venv /tmp/smoke --python 3.14
          uv pip install --python /tmp/smoke --no-deps dist/*.whl
          /tmp/smoke/bin/python - <<PY
          import importlib.metadata as m, pathlib
          name = pathlib.Path(next(pathlib.Path("dist").glob("*.whl"))).name.split("-")[0]
          version = m.version(name)
          assert "v" + version == "$TAG", (version, "$TAG")
          print(name, version)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  upload:
    name: attach to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber ./*
